<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" role="img" aria-labelledby="t d"><title id="t">Ondas de choque: dor e curvatura</title><desc id="d">Gráfico conceitual: benefício mais consistente para dor do que para correção da curvatura</desc><rect width="850" height="480" fill="#f4f8fa"/><text x="45" y="57" font-family="sans-serif" font-size="29" font-weight="bold" fill="#123e54">Ondas de choque: qual é o objetivo?</text><text x="45" y="110" font-family="sans-serif" font-size="21" fill="#254d5d">Alívio da dor</text><rect x="260" y="85" width="445" height="34" rx="8" fill="#cfe9e5"/><rect x="260" y="85" width="360" height="34" rx="8" fill="#167b82"/><text x="45" y="205" font-family="sans-serif" font-size="21" fill="#254d5d">Correção da curvatura</text><rect x="260" y="180" width="445" height="34" rx="8" fill="#e5e9ec"/><rect x="260" y="180" width="65" height="34" rx="8" fill="#aab8be"/><text x="45" y="293" font-family="sans-serif" font-size="19" fill="#45606b">Barras esquemáticas, sem representar magnitude de efeito.</text><text x="45" y="330" font-family="sans-serif" font-size="19" fill="#45606b">Base: discussão de Palmieri et al. e diretrizes EAU.</text><text x="45" y="387" font-family="sans-serif" font-size="17" fill="#45606b">Material educativo · Peyronie BH</text></svg>