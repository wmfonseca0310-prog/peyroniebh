<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 490" role="img" aria-labelledby="t d"><title id="t">Tração peniana e curvatura em estudo prospectivo</title><desc id="d">Resultados do estudo Martínez-Salamanca: curvatura média de 33 para 15 graus, com limitações metodológicas</desc><rect width="850" height="490" fill="#f4f8fa"/><text x="42" y="55" font-family="sans-serif" font-size="28" font-weight="bold" fill="#123e54">Tração peniana: exemplo de estudo</text><text x="42" y="100" font-family="sans-serif" font-size="19" fill="#35515c">Curvatura média relatada (graus)</text><line x1="130" y1="390" x2="740" y2="390" stroke="#66808c" stroke-width="2"/><rect x="220" y="145" width="160" height="245" rx="8" fill="#27778a"/><rect x="490" y="279" width="160" height="111" rx="8" fill="#72b8b4"/><text x="300" y="130" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#12485e">33°</text><text x="570" y="264" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#12485e">15°</text><text x="300" y="426" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#254d5d">Antes</text><text x="570" y="426" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#254d5d">Após</text><text x="42" y="467" font-family="sans-serif" font-size="16" fill="#45606b">Martínez-Salamanca et al. (2014); estudo não randomizado. Não prevê resposta individual.</text></svg>